name: Build GoofyVoice

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install Rust
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://win.rustup.rs -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable

      - name: Install Pake
        shell: pwsh
        run: |
          $env:Path += ";$env:USERPROFILE\.cargo\bin"
          npm install -g pake-cli

      - name: Build App
        shell: pwsh
        run: |
          $env:Path += ";$env:USERPROFILE\.cargo\bin"
          pake https://goofyvoice.com --name GoofyVoice --width 1200 --height 800

      - name: List output files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 10

      - name: Upload all bundles
        uses: actions/upload-artifact@v4
        with:
          name: GoofyVoice-windows
          path: |
            **/*.msi
            **/*.exe
