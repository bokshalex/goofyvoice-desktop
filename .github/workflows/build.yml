name: Build

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Rust
        shell: pwsh
        run: |
          irm https://win.rustup.rs -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          "$env:USERPROFILE\.cargo\bin" | Out-File $env:GITHUB_PATH -Append
          rustc --version
          cargo --version

      - name: Install Pake
        shell: pwsh
        run: |
          npm install -g pake-cli
          pake --version

      - name: Build GoofyVoice
        shell: pwsh
        run: |
          pake https://goofyvoice.com --name GoofyVoice --width 1200 --height 800
          Get-ChildItem -Path . -Filter "*.msi" -Recurse | Select-Object FullName, Length

      - name: Upload GoofyVoice MSI
        uses: actions/upload-artifact@v4
        with:
          name: GoofyVoice
          path: GoofyVoice.msi
